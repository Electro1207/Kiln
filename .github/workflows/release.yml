name: Release

# Publishing a GitHub release whose tag matches packages/kiln's version (v0.2.0 for 0.2.0)
# publishes the npm package with provenance, through npm trusted publishing (no token stored).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.2.2
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build:lib
      - name: Check the tag matches the package version
        run: |
          v=$(node -p "require('./packages/kiln/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package version $v"; exit 1; }
      - run: npm publish --provenance --access public
        working-directory: packages/kiln
