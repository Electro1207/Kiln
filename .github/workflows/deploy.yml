name: Deploy

# The site (and the copy-in registry and installer it serves) deploys with each GitHub release, from the
# same tag that release.yml publishes to npm, so the CLI and the npm package always ship the same library.
# Pushes to main no longer deploy; run it by hand (workflow_dispatch) for a site-only fix.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: usekiln
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: node scripts/check-parity.mjs
      - name: Create the Pages project on first run
        run: |
          if ! npx --no-install wrangler pages project list | grep -qw "$PROJECT"; then
            npx --no-install wrangler pages project create "$PROJECT" --production-branch=main
          fi
      - name: Deploy
        run: npx --no-install wrangler pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
