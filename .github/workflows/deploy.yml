name: Deploy

# Every push to main is checked, built and deployed to Cloudflare Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: usekiln
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - name: Create the Pages project on first run
        run: |
          if ! npx --no-install wrangler pages project list | grep -qw "$PROJECT"; then
            npx --no-install wrangler pages project create "$PROJECT" --production-branch=main
          fi
      - name: Deploy
        run: npx --no-install wrangler pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
